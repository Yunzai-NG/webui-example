<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    九宫格切 24px：四角各 24×24 不拉伸，四边与中间随卡片拉伸。
    必须写 width / height：没有它们，浏览器按 300×150 算切片，四角会被拉得变形。
    四边只放能拉伸的东西（一条实线），虚线一类的图案拉开之后就散了。
  -->
  <rect x="3" y="3" width="90" height="90" rx="16" fill="#ffffff" stroke="#9fd3b8" stroke-width="2"/>
  <g fill="#5fbf8f">
    <path d="M5 17c0-7 5-12 12-12-1 6-5 11-12 12z"/>
    <path d="M91 17c0-7-5-12-12-12 1 6 5 11 12 12z"/>
    <path d="M5 79c0 7 5 12 12 12-1-6-5-11-12-12z"/>
    <path d="M91 79c0 7-5 12-12 12 1-6 5-11 12-12z"/>
  </g>
</svg>
